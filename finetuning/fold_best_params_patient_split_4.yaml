logging:
  mode: online
  project: cellvit++
  notes: cellvit++
  log_comment: cellvit_samh_ensemble_finetune_split_4
  wandb_dir: ./logs_ensemble
  log_dir: ./logs_ensemble
  level: Info


random_seed: 42 #using 5 different seeds: 42, 21, 0, 4, 28
gpu: 0

data:
  dataset: DetectionDataset
  dataset_path: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel
  train_filelist: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel/splits/patient_split_4/train.csv
  val_filelist: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel/splits/patient_split_4/val.csv
  normalize_stains_train: false
  normalize_stains_val: false
  num_classes: 3
  label_map:
    '0': monocytes
    '1': lymphocytes
    '2': other

cellvit_path: /work/grana_urologia/MONKEY_challenge/source/sota_architectures/CellViT-plus-plus/checkpoints/SAM/CellViT-SAM-H-x40-AMP.pth

model:
  hidden_dim: 128

training:
  cache_cell_dataset: true
  batch_size: 64
  epochs: 50
  drop_rate: 0.3
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0006778364422552321
    weight_decay: 0.0009933578975506285
  early_stopping_patience: 20
  mixed_precision: true
  eval_every: 1
  scheduler:
    scheduler_type: constant