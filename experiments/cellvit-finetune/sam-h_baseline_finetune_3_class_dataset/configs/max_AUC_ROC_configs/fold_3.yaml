logging:
  mode: online
  project: cellvit++
  notes: cellvit++
  log_comment: cellvit++ baseline finetuning
  wandb_dir: /work/grana_urologia/MONKEY_challenge/logs/Finetuning/baseline_finetuning
  log_dir: /work/grana_urologia/MONKEY_challenge/logs/Finetuning/baseline_finetuning
  level: Debug

random_seed: 42
gpu: 0

data:
  dataset: DetectionDataset
  dataset_path: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel
  train_filelist: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel/splits/fold_3/train.csv
  val_filelist: /work/grana_urologia/MONKEY_challenge/data/monkey_cellvit_3_cls_parallel/splits/fold_3/val.csv
  normalize_stains_train: false
  normalize_stains_val: false
  num_classes: 3

label_map:
    '0': monocytes
    '1': lymphocytes
    '2': other

cellvit_path: /work/grana_urologia/MONKEY_challenge/checkpoints/SAM/CellViT-SAM-H-x40-AMP.pth

model:
  hidden_dim: 128

training:
  cache_cell_dataset: true
  batch_size: 64
  epochs: 50
  drop_rate: 0.3
  optimizer: AdamW
  optimizer_hyperparameter:
    betas:
    - 0.85
    - 0.9
    lr: 0.0001841528712212989
    weight_decay: 0.0006450966456966342
  early_stopping_patience: 20
  mixed_precision: true
  eval_every: 1
  scheduler:
    scheduler_type: exponential

just_load_model: false

